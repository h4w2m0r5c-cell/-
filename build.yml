name: Build iOS dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          clang -dynamiclib -arch arm64 -arch arm64e -target arm64-apple-ios15.0 \
          -framework UIKit -framework Foundation -framework Security \
          AuthLib.m -o AuthLib.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuthLib
          path: AuthLib.dylib